<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PayTrack{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .sidebar { min-height: 100vh; background: #1e293b; }
        .sidebar a { color: #cbd5e1; text-decoration: none; padding: .6rem 1rem; display: block; border-radius: .375rem; margin: .1rem .5rem; }
        .sidebar a:hover, .sidebar a.active { background: #334155; color: #fff; }
        .sidebar .brand { color: #fff; font-size: 1.2rem; font-weight: 700; padding: 1rem; text-align: center; }
        .stat-card { border: none; border-radius: .75rem; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        .stat-card .icon { font-size: 2rem; }
    </style>
</head>
<body>
<div class="d-flex">
    <!-- Sidebar -->
    <nav class="sidebar col-md-3 col-lg-2 d-md-block p-0">
        <div class="brand"><i class="bi bi-cash-coin"></i> PayTrack</div>
        <a href="{% url 'dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="{% url 'employee_list' %}" class="{% if 'employee' in request.resolver_match.url_name %}active{% endif %}"><i class="bi bi-people"></i> Employees</a>
        <a href="{% url 'department_list' %}" class="{% if 'department' in request.resolver_match.url_name %}active{% endif %}"><i class="bi bi-building"></i> Departments</a>
        <a href="{% url 'transaction_list' %}" class="{% if 'transaction' in request.resolver_match.url_name %}active{% endif %}"><i class="bi bi-receipt"></i> Transactions</a>
        <a href="{% url 'transaction_create' %}"><i class="bi bi-plus-circle"></i> New Transaction</a>
        <hr class="text-secondary">
        <a href="{% url 'employee_create' %}"><i class="bi bi-person-plus"></i> Add Employee</a>
        <a href="{% url 'department_create' %}"><i class="bi bi-building-add"></i> Add Department</a>
        <hr class="text-secondary">
        <a href="/admin/" target="_blank"><i class="bi bi-gear"></i> Admin Panel</a>
        <a href="{% url 'logout' %}"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </nav>

    <!-- Main content -->
    <main class="col-md-9 col-lg-10 ms-sm-auto px-4 py-4 flex-grow-1">
        {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
