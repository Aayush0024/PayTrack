<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayTrack – Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1e293b, #334155); min-height: 100vh; display: flex; align-items: center; }
        .login-card { max-width: 420px; margin: 0 auto; border-radius: 1rem; box-shadow: 0 10px 40px rgba(0,0,0,.2); }
        .login-card .brand { font-size: 1.6rem; font-weight: 700; color: #1e293b; }
    </style>
</head>
<body>
<div class="container">
    <div class="card login-card p-4">
        <div class="text-center mb-4">
            <i class="bi bi-cash-coin" style="font-size: 3rem; color: #2563eb;"></i>
            <h2 class="brand mt-2">PayTrack</h2>
            <p class="text-muted">Employee Payment Transaction Platform</p>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control form-control-lg" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control form-control-lg" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 btn-lg">Sign in</button>
        </form>
        <p class="text-center mt-3 mb-0">
            <a href="{% url 'signup' %}" class="text-decoration-none">Create an account</a>
        </p>
    </div>
</div>
</body>
</html>
