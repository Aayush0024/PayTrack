<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayTrack – Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1e293b, #334155); min-height: 100vh; display: flex; align-items: center; }
        .signup-card { max-width: 480px; margin: 0 auto; border-radius: 1rem; box-shadow: 0 10px 40px rgba(0,0,0,.2); }
    </style>
</head>
<body>
<div class="container">
    <div class="card signup-card p-4">
        <div class="text-center mb-3">
            <i class="bi bi-cash-coin" style="font-size: 2.5rem; color: #2563eb;"></i>
            <h3>PayTrack</h3>
            <p class="text-muted">Create your account</p>
        </div>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-2">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<div class="text-danger small">{{ field.errors|join:", " }}</div>{% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary w-100 btn-lg mt-3">Sign Up</button>
        </form>
        <p class="text-center mt-3 mb-0">
            Already have an account? <a href="{% url 'login' %}" class="text-decoration-none">Log in</a>
        </p>
    </div>
</div>
</body>
</html>
